[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain"
version = "2.0.0"
description = "Local, cited retrieval over personal documents using Qdrant and sentence-transformers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Second Brain contributors" }]
# Declared so a wheel install is self-contained. requirements.txt stays the
# canonical pin set; requirements-test.txt intentionally omits these heavy
# packages because the tests never import the model/SDK dependencies.
dependencies = [
    "pypdf==6.21.4",
    "pymupdf==2.0",
    'numpy==2.5.4; python_version >= "3.12"',
    'numpy==2.4.6; python_version < "3.12"',
    "sentence-transformers==6.2.0",
    "torch==2.15.0",
    "transformers==5.22.1",
    "scikit-learn==1.9.1",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.33",
    "python-dotenv==1.2.4",
    "filelock==4.2.12",
    "google-genai==2.34.0",
    "groq==1.7.0",
    "rank-bm25==0.2.2",
    "qdrant-client==1.20.0",
]

[project.scripts]
second-brain-search = "search:main"
second-brain-evaluate = "evaluate:main"

[tool.setuptools]
py-modules = [
    "chunker", "evaluate", "inspect_chunks", "loader",
    "qdrant_store", "search", "testset", "transcribe",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
