[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain"
version = "2.0.0"
description = "Local, cited retrieval over personal documents using Qdrant and sentence-transformers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Second Brain contributors" }]
# Runtime versions are pinned in requirements.txt; kept separate so the
# lightweight test install does not pull in torch.
dependencies = []

[project.scripts]
second-brain-search = "search:main"
second-brain-evaluate = "evaluate:main"

[tool.setuptools]
py-modules = [
    "chunker", "evaluate", "inspect_chunks", "loader",
    "qdrant_store", "search", "testset", "transcribe",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
