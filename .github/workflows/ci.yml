name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Check dependency graph
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Compile
        run: python -m compileall -q chunker.py loader.py search.py qdrant_store.py evaluate.py testset.py transcribe.py inspect_chunks.py app

      - name: Wheel smoke test
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m pip install --no-deps dist/second_brain-*.whl
          cd "${RUNNER_TEMP}"  # import the installed wheel, not the source tree
          python -c "import app.main"
