services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: second-brain-qdrant
    restart: unless-stopped
    ports:
      # REST only, loopback only. gRPC (6334) is unused and stays unpublished.
      - "127.0.0.1:6333:6333"
    environment:
      # Qdrant collects anonymous usage statistics by default. The privacy
      # claim in README.md assumes this is disabled.
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
